<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#10151b">
  <title>DEVIL'S GAME 1 | 96/46</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/animation.css">
  <script src="js/rules.js" defer></script>
  <script src="js/deck.js" defer></script>
  <script src="js/game.js" defer></script>
  <script src="js/cpu.js" defer></script>
  <script src="js/online.js" defer></script>
  <script src="js/ui.js" defer></script>
  <script src="js/main.js" defer></script>
</head>
<body>
  <main class="app" id="app">
    <section class="portrait-message" aria-label="画面回転の案内">
      <div class="rotate-symbol" aria-hidden="true">↻</div>
      <h1>DEVIL'S GAME 1</h1>
      <p>端末を横向きにしてプレイしてください</p>
    </section>
    <section class="game-screen" aria-label="ゲーム画面">
      <div class="room">
        <header class="game-header"><span>96/46 ORIGINAL PLAYING DECK</span><span>D1 — UI PROTOTYPE</span></header>
        <div class="opponent-area" aria-label="対戦相手の配置予定エリア">OPPONENT AREA</div>
        <div class="table-area" aria-label="テーブルの配置予定エリア"><span>TABLE / PLAY AREA</span></div>
        <div class="player-area" aria-label="自分の手札の配置予定エリア">YOUR HAND AREA</div>
        <footer class="game-footer">DEVIL'S GAME 1 <span>画面構成の仮表示・ゲーム処理は未実装</span></footer>
      </div>
    </section>
  </main>
</body>
</html>
